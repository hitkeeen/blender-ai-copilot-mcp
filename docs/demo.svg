<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="pedestalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D6FC4"/>
      <stop offset="1" stop-color="#274A8C"/>
    </linearGradient>
    <linearGradient id="productGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5A35C"/>
      <stop offset="1" stop-color="#E2761B"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13213E"/>
      <stop offset="1" stop-color="#0D1830"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="960" height="540" fill="#0B1220"/>

  <!-- window frame -->
  <rect x="16" y="16" width="928" height="508" rx="12" fill="#0E1728" stroke="#263252"/>
  <circle cx="42" cy="41" r="5" fill="#F0862B"/>
  <circle cx="62" cy="41" r="5" fill="#8B5CF6"/>
  <circle cx="82" cy="41" r="5" fill="#38BDF8"/>
  <text x="480" y="46" text-anchor="middle" font-size="13" fill="#9AA4BF">Blender 4.2 — Copilot Studio workspace</text>

  <!-- 3D viewport panel -->
  <rect x="32" y="64" width="560" height="392" rx="10" fill="url(#floorGrad)" stroke="#263252"/>
  <text x="52" y="92" font-size="13" font-weight="700" fill="#E8EAF2">3D Viewport</text>
  <text x="52" y="110" font-size="11" fill="#9AA4BF">Scene: product-display — live preview</text>

  <!-- floor grid -->
  <g stroke="#22345C" stroke-width="1">
    <line x1="312" y1="240" x2="60" y2="436"/>
    <line x1="312" y1="240" x2="150" y2="436"/>
    <line x1="312" y1="240" x2="240" y2="436"/>
    <line x1="312" y1="240" x2="330" y2="436"/>
    <line x1="312" y1="240" x2="420" y2="436"/>
    <line x1="312" y1="240" x2="510" y2="436"/>
    <line x1="312" y1="240" x2="570" y2="436"/>
    <line x1="60" y1="268" x2="564" y2="268"/>
    <line x1="60" y1="296" x2="564" y2="296"/>
    <line x1="60" y1="332" x2="564" y2="332"/>
    <line x1="60" y1="376" x2="564" y2="376"/>
    <line x1="60" y1="428" x2="564" y2="428"/>
  </g>

  <!-- light beams -->
  <g stroke="#F0862B" stroke-width="1" stroke-dasharray="4 4" opacity="0.55">
    <line x1="130" y1="168" x2="258" y2="300"/>
    <line x1="312" y1="140" x2="286" y2="286"/>
    <line x1="480" y1="180" x2="330" y2="300"/>
  </g>

  <!-- lights -->
  <g stroke="#F5A35C" stroke-width="2" fill="#F0862B">
    <circle cx="130" cy="158" r="9"/>
    <circle cx="312" cy="130" r="9"/>
    <circle cx="480" cy="170" r="9"/>
  </g>
  <g stroke="#F5A35C" stroke-width="1.6">
    <line x1="130" y1="142" x2="130" y2="134"/><line x1="130" y1="174" x2="130" y2="182"/>
    <line x1="114" y1="158" x2="106" y2="158"/><line x1="146" y1="158" x2="154" y2="158"/>
    <line x1="312" y1="114" x2="312" y2="106"/><line x1="312" y1="146" x2="312" y2="154"/>
    <line x1="296" y1="130" x2="288" y2="130"/><line x1="328" y1="130" x2="336" y2="130"/>
    <line x1="480" y1="154" x2="480" y2="146"/><line x1="480" y1="186" x2="480" y2="194"/>
    <line x1="464" y1="170" x2="456" y2="170"/><line x1="496" y1="170" x2="504" y2="170"/>
  </g>
  <g font-size="10" fill="#9AA4BF">
    <text x="130" y="198" text-anchor="middle">Key light</text>
    <text x="312" y="170" text-anchor="middle">Fill light</text>
    <text x="480" y="210" text-anchor="middle">Rim light</text>
  </g>

  <!-- pedestal -->
  <g>
    <polygon points="232,306 342,306 362,288 252,288" fill="#4F8FF7"/>
    <rect x="232" y="306" width="110" height="72" fill="url(#pedestalGrad)" stroke="#4F8FF7"/>
    <polygon points="342,306 362,288 362,360 342,378" fill="#1D3870"/>
    <text x="287" y="348" text-anchor="middle" font-size="11" fill="#DCE7FF">Pedestal</text>
  </g>

  <!-- product on pedestal -->
  <g>
    <polygon points="252,252 312,252 324,240 264,240" fill="#F5A35C"/>
    <rect x="252" y="252" width="60" height="52" rx="4" fill="url(#productGrad)" stroke="#F5A35C"/>
    <polygon points="312,252 324,240 324,292 312,304" fill="#B85E12"/>
    <text x="282" y="282" text-anchor="middle" font-size="10" fill="#3A2200">Product</text>
  </g>

  <!-- selection outline -->
  <rect x="220" y="230" width="154" height="160" rx="8" fill="none" stroke="#F0862B" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- camera -->
  <g>
    <rect x="452" y="316" width="52" height="34" rx="5" fill="#14203C" stroke="#38BDF8" stroke-width="2"/>
    <polygon points="504,324 528,314 528,352 504,342" fill="#14203C" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="478" cy="333" r="8" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <text x="490" y="370" text-anchor="middle" font-size="10" fill="#9AA4BF">Camera</text>
  </g>

  <!-- viewport footer strip: task board -->
  <rect x="44" y="414" width="536" height="32" rx="8" fill="#0F1830" stroke="#263252"/>
  <text x="58" y="434" font-size="11" fill="#9AA4BF">Task board:</text>
  <rect x="130" y="421" width="132" height="18" rx="9" fill="#1B2E1E" stroke="#98D85B"/>
  <text x="196" y="434" text-anchor="middle" font-size="10" fill="#98D85B">Manager — plan ready</text>
  <rect x="272" y="421" width="140" height="18" rx="9" fill="#1D2B4A" stroke="#38BDF8"/>
  <text x="342" y="434" text-anchor="middle" font-size="10" fill="#7FC4FF">Worker — step 4 of 5</text>
  <rect x="422" y="421" width="146" height="18" rx="9" fill="#251B3E" stroke="#8B5CF6"/>
  <text x="495" y="434" text-anchor="middle" font-size="10" fill="#C4A9FF">Reviewer — pending</text>

  <!-- chat panel -->
  <rect x="608" y="64" width="320" height="392" rx="10" fill="#0F1830" stroke="#263252"/>
  <text x="628" y="92" font-size="13" font-weight="700" fill="#E8EAF2">Copilot Chat</text>
  <rect x="786" y="78" width="122" height="20" rx="10" fill="#1D2B4A" stroke="#38BDF8"/>
  <text x="847" y="92" text-anchor="middle" font-size="10" fill="#7FC4FF">OpenAI · GPT-4o</text>

  <!-- user bubble -->
  <rect x="668" y="112" width="240" height="64" rx="10" fill="#1D2B4A"/>
  <text x="680" y="132" font-size="11" fill="#E8EAF2">Create a product-display scene:</text>
  <text x="680" y="148" font-size="11" fill="#E8EAF2">pedestal, camera, three lights.</text>
  <text x="680" y="164" font-size="11" fill="#E8EAF2">Matte blue pedestal, please.</text>

  <!-- assistant bubble -->
  <rect x="628" y="190" width="280" height="150" rx="10" fill="#14203C" stroke="#2A3C66"/>
  <text x="642" y="210" font-size="11" font-weight="700" fill="#E8EAF2">Plan ready — 5 steps</text>
  <g font-size="11" fill="#C7D2EA">
    <text x="642" y="232"><tspan fill="#98D85B">&#10003;</tspan>  Inspect scene context</text>
    <text x="642" y="252"><tspan fill="#98D85B">&#10003;</tspan>  Add pedestal + blue material</text>
    <text x="642" y="272"><tspan fill="#98D85B">&#10003;</tspan>  Add camera</text>
    <text x="642" y="292"><tspan fill="#98D85B">&#10003;</tspan>  Add key, fill and rim lights</text>
    <text x="642" y="312"><tspan fill="#F0862B">&#9679;</tspan>  Awaiting your approval</text>
  </g>
  <rect x="642" y="320" width="96" height="22" rx="11" fill="#1B2E1E" stroke="#98D85B"/>
  <text x="690" y="335" text-anchor="middle" font-size="11" fill="#98D85B">Approve</text>
  <rect x="748" y="320" width="88" height="22" rx="11" fill="none" stroke="#9AA4BF"/>
  <text x="792" y="335" text-anchor="middle" font-size="11" fill="#9AA4BF">Cancel</text>

  <!-- input box -->
  <rect x="628" y="356" width="280" height="34" rx="17" fill="#0B1220" stroke="#2A3C66"/>
  <text x="646" y="378" font-size="11" fill="#9AA4BF">Ask Blender Copilot&#8230;</text>
  <circle cx="884" cy="373" r="11" fill="#F0862B"/>
  <path d="M880 373 h8 M884 369 l4 4 -4 4" stroke="#0B1220" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- hint -->
  <text x="768" y="424" text-anchor="middle" font-size="10" fill="#9AA4BF">Every mutation is confirmed, cancellable</text>
  <text x="768" y="438" text-anchor="middle" font-size="10" fill="#9AA4BF">and rolled back with named undo steps</text>
</svg>
